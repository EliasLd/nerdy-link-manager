name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Go dependencies
        run: go mod download

      - name: Install golang migrate (with SQLite support)
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          go install -tags 'sqlite3' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
          migrate -version

      - name: Run database migrations (SQLite)
        run: |
          mkdir -p /tmp/db
          migrate -path ./internal/db/migrations -database "sqlite3:///tmp/db/ci_test.db" up

      - name: Run Go tests
        env:
          DB_PATH: /tmp/db/ci_test.db
        run: go test ./... -v

      - name: Build backend binary
        run: go build ./cmd/main.go
  
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend build
        env:
          PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend container
        run:  |
          cd frontend
          podman build --build-arg PUBLIC_API_URL=http://localhost:8080 -t nerdy-lm-frontend .

